monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "alsa_card.platform-1000480000.usb"
      }
    ],
    actions = {
      update-props = {
        device.description = "UAC2 Gadget 1"
        device.nick = "UAC2-1"
      }
    }
  },
  {
    matches = [
      {
        device.name = "alsa_card.platform-1000480000.usb.2"
      }
    ],
    actions = {
      update-props = {
        device.description = "UAC2 Gadget 2"
        device.nick = "UAC2-2"
      }
    }
  }
]
