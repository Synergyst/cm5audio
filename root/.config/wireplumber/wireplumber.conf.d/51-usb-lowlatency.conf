monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_output.platform-soc_107c000000_sound.pro-output-0" }
    ],
    actions = {
      update-props = {
        api.alsa.period-size = 512
        api.alsa.period-num = 3
        api.alsa.headroom = 128
      }
    }
  },
  {
    matches = [
      { node.name = "alsa_input.platform-soc_107c000000_sound.pro-input-0" }
    ],
    actions = {
      update-props = {
        api.alsa.period-size = 512
        api.alsa.period-num = 3
        api.alsa.headroom = 128
      }
    }
  },
  {
    matches = [
      { node.name = "~alsa_input.*AT2020USB.*" }
    ],
    actions = {
      update-props = {
        api.alsa.period-size = 512
        api.alsa.period-num = 3
        api.alsa.headroom = 128
      }
    }
  },
  {
    matches = [
      { node.name = "~alsa_output.*AT2020USB.*" }
    ],
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  },
  {
    matches = [
      { node.name = "~alsa_output.*UAC.*" }
    ],
    actions = {
      update-props = {
        api.alsa.period-size = 512
        api.alsa.period-num = 3
        api.alsa.headroom = 128
      }
    }
  }
]
