        function createPwEndpointBlock(node, portList) {
            const block = document.createElement('div');
            block.className = 'endpoint-block pw-block';
            block.id = `pw-block-${node.id}`;
            const layoutKey = getPipeWireLayoutKey(node);
            block.dataset.epId = layoutKey;
            block.dataset.layoutKey = layoutKey;
            block.dataset.portSignature = portList.join(',');

            const pos = getPipeWireLayoutPosition(node, 0);
            block.style.transform = `translate(${pos.x}px, ${pos.y}px)`;

            const header = document.createElement('div');
            header.className = 'endpoint-header';
            header.textContent = getPipeWireLayoutLabel(node);
            block.appendChild(header);
            setupBlockDragging(block, layoutKey);

            portList.forEach((portId, index) => {
                const row = document.createElement('div');
                row.className = 'channel-row';
                row.id = `pw-slot-${node.id}-${portId}`;
                
                // Inject the actual vu-fill and vu-peak bars inside the vu-container using index
                const meterHtml = `
                    <div class="vu-fill" id="vu-pw-node/${node.id}-${index}"></div>
                    <div class="vu-peak" id="peak-pw-node/${node.id}-${index}"></div>
                `;

                row.innerHTML = node.is_input 
                    ? `<span class="ch-label">P${portId}</span><div class="vu-container">${meterHtml}</div>` 
                    : `<div class="vu-container">${meterHtml}</div><span class="ch-label" style="text-align: right;">P${portId}</span>`;
                
                block.appendChild(row);
            });

            pwEndpointBlocks.set(node.id, block);
            return block;
        }

        function handleSlotClick(ep, ch) {
            const row = $(`slot-${ep.id}-${ch}`);
            if (ep.direction === 'source') {
                document.querySelectorAll('.channel-row.selected').forEach(el => el.classList.remove('selected'));
                row.classList.add('selected');
                activeSource = { endpointId: ep.id, channel: ch };
            } else if (ep.direction === 'destination' && activeSource) {
                createRoute(activeSource.endpointId, activeSource.channel, ep.id, ch);
                document.querySelectorAll('.channel-row.selected').forEach(el => el.classList.remove('selected'));
                activeSource = null;
            }
        }

        async function createRoute(srcId, srcCh, destId, destCh) {
            try {
                const params = new URLSearchParams({
                    source_node: srcId,
                    source_channel: srcCh,
                    destination_node: destId,
                    destination_channel: destCh,
                    gain: 1.0,
                    enabled: '1'
                });
                await fetchAPI(`/api/routes?${params.toString()}`, { method: 'POST' });
                await loadGraph();
            } catch (e) {
                alert('Routing failed: ' + e.message);
            }
        }

        function getEndpointId(nodeRef) {
            if (!graph.endpoints) return nodeRef;
            const direct = graph.endpoints.find(e => e.id == nodeRef);
            if (direct) return direct.id;
            const idx = Number(nodeRef);
            if (!isNaN(idx) && graph.endpoints[idx]) {
                return graph.endpoints[idx].id;
            }
            return nodeRef;
        }

        function drawCables() {
            if (activeTabName !== 'patchbay') return;
            const svg = $('cable-svg');

            const cables = svg.querySelectorAll('.cable');
            cables.forEach(c => c.remove());

            const viewportRect = $('patchbay-viewport').getBoundingClientRect();

            // 1. Render Internal cm5audio Routes
            if (graph.routes && graph.routes.length > 0) {
                graph.routes.forEach((route) => {
                    const srcRef = route.source_node !== undefined ? route.source_node : route.source;
                    const destRef = route.destination_node !== undefined ? route.destination_node : route.destination;

                    const srcEpId = getEndpointId(srcRef);
                    const destEpId = getEndpointId(destRef);

                    const srcSlotId = `slot-${srcEpId}-${route.source_channel}`;
                    const destSlotId = `slot-${destEpId}-${route.destination_channel}`;

                    const srcEl = $(srcSlotId);
                    const destEl = $(destSlotId);
                    if (!srcEl || !destEl) return;

                    const srcRect = srcEl.getBoundingClientRect();
                    const destRect = destEl.getBoundingClientRect();

                    const x1 = (srcRect.right - viewportRect.left) / scale;
                    const y1 = (srcRect.top + srcRect.height/2 - viewportRect.top) / scale;
                    const x2 = (destRect.left - viewportRect.left) / scale;
                    const y2 = (destRect.top + destRect.height/2 - viewportRect.top) / scale;

                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    const cp1x = x1 + (x2 - x1) * 0.5;
                    const cp2x = x1 + (x2 - x1) * 0.5;
                    path.setAttribute('d', `M ${x1} ${y1} C ${cp1x} ${y1}, ${cp2x} ${y2}, ${x2} ${y2}`);
                    path.setAttribute('class', 'cable');

                    const strokeColor = route.enabled ? '#88c0d0' : '#bf616a';
                    path.setAttribute('stroke', strokeColor);

                    if (route.dsp_active) {
                        path.classList.add('cable-fx');
                    }

                    path.onclick = () => openRouteModal(route);
                    svg.appendChild(path);
                });
            }

            // 2. Render Native PipeWire Links
            if (pwGraph.links && pwGraph.links.length > 0) {
                pwGraph.links.forEach((link) => {
                    const srcSlotId = `pw-slot-${link.source_node}-${link.source_port}`;
                    const destSlotId = `pw-slot-${link.dest_node}-${link.dest_port}`;

                    const srcEl = $(srcSlotId);
                    const destEl = $(destSlotId);
                    if (!srcEl || !destEl) return;

                    const srcRect = srcEl.getBoundingClientRect();
                    const destRect = destEl.getBoundingClientRect();

                    const x1 = (srcRect.right - viewportRect.left) / scale;
                    const y1 = (srcRect.top + srcRect.height/2 - viewportRect.top) / scale;
                    const x2 = (destRect.left - viewportRect.left) / scale;
                    const y2 = (destRect.top + destRect.height/2 - viewportRect.top) / scale;

                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    const cp1x = x1 + (x2 - x1) * 0.5;
                    const cp2x = x1 + (x2 - x1) * 0.5;
                    path.setAttribute('d', `M ${x1} ${y1} C ${cp1x} ${y1}, ${cp2x} ${y2}, ${x2} ${y2}`);
                    path.setAttribute('class', 'cable pw-cable');
                    path.setAttribute('stroke', 'var(--pw-primary)');

                    svg.appendChild(path);
                });
            }
        }

        function dspText(tag, text, className = '') {
            const element = document.createElement(tag);
            element.textContent = text;
            element.className = className;
            return element;
        }

        function setRouteError(message = '') {
            $('route-error').textContent = message;
            $('route-error').hidden = !message;
        }

        function validateDspDiscovery(data) {
            if (!isObject(data) || data.schema_version !== 1 ||
                !Number.isInteger(data.max_chain_length) || data.max_chain_length < 0 ||
                !Array.isArray(data.processors)) {
                throw new Error('Unsupported or invalid DSP discovery response (expected schema version 1).');
            }
            const types = new Set();
            const parameterTypes = new Set(['number', 'integer', 'boolean', 'string', 'enum']);
            for (const processor of data.processors) {
                if (!isObject(processor) || typeof processor.type !== 'string' || !processor.type ||
                    types.has(processor.type) || !isObject(processor.defaults) || !Array.isArray(processor.parameters)) {
                    throw new Error('Invalid processor metadata in DSP discovery response.');
                }
                types.add(processor.type);
                const ids = new Set();
                for (const parameter of processor.parameters) {
                    if (!isObject(parameter) || typeof parameter.id !== 'string' || !parameter.id ||
                        ids.has(parameter.id) || !parameterTypes.has(parameter.type) || !hasOwn(parameter, 'default')) {
                        throw new Error('Invalid parameter metadata for processor ' + processor.type + '.');
                    }
                    ids.add(parameter.id);
                    if (parameter.type === 'enum' && (!Array.isArray(parameter.choices) ||
                        parameter.choices.some(choice => !isObject(choice) || !hasOwn(choice, 'value')))) {
                        throw new Error('Invalid enum choices for processor ' + processor.type + '.');
                    }
                    for (const bound of ['min', 'max', 'step']) {
                        if (parameter[bound] != null && (!Number.isFinite(parameter[bound]) ||
                            (bound === 'step' && parameter[bound] <= 0))) {
                            throw new Error('Invalid numeric metadata for processor ' + processor.type + '.');
                        }
                    }
                }
            }
            return data;
        }

        async function loadDspAvailable() {
            const request = ++dspDiscoveryRequest;
            dspDiscovery = { status: 'loading', processors: [], maxChainLength: null, error: '' };
            renderDspDiscovery();
            try {
                const data = validateDspDiscovery(await fetchAPI('/api/dsp/available', { cache: 'no-store' }));
                if (request !== dspDiscoveryRequest) return;
                dspDiscovery = { status: 'ready', processors: data.processors, maxChainLength: data.max_chain_length, error: '' };
            } catch (e) {
                if (request !== dspDiscoveryRequest) return;
                dspDiscovery = { status: 'error', processors: [], maxChainLength: null, error: e.message };
                showError('DSP discovery failed: ' + e.message);
            }
            renderDspDiscovery();
        }

        function renderDspDiscovery() {
            const select = $('new-processor-type');
            const previous = select.value;
            select.replaceChildren();
            const status = $('dsp-discovery-status');
            status.className = 'dsp-help dsp-message';
            if (dspDiscovery.status === 'ready') {
                for (const processor of dspDiscovery.processors) {
                    const option = dspText('option', processor.name ?? processor.type);
                    option.value = processor.type;
                    option.title = processor.description ?? '';
                    select.appendChild(option);
                }
                if (dspDiscovery.processors.some(processor => processor.type === previous)) select.value = previous;
                const length = currentRouteDspState?.chain.length ?? 0;
                status.textContent = `${dspDiscovery.processors.length} processors available. Chain: ${length}/${dspDiscovery.maxChainLength}.`;
                if (dspDiscovery.processors.length === 0) status.textContent += ' No DSP processors are registered on this backend.';
                if (length > dspDiscovery.maxChainLength) {
                    status.classList.add('dsp-warning');
                    status.textContent += ' Remove processors to meet the chain limit before applying.';
                }
            } else if (dspDiscovery.status === 'error') {
                status.classList.add('dsp-error');
                status.textContent = 'Unable to discover DSP processors: ' + dspDiscovery.error + '\nAdding and applying are disabled. Check the backend and use Refresh processors to retry.';
            } else {
                status.textContent = 'Loading DSP processors from the backend… Adding and applying are disabled until discovery succeeds.';
            }
            if (editingRouteId !== null && !modalBusy) renderDspChain();
            updateModalControls();
        }

        function updateModalControls() {
            const stateLocked = modalBusy || currentRouteDspState === null;
            $('modal-gain').disabled = modalBusy;
            $('modal-enabled').disabled = modalBusy;
            $('modal-dsp-active').disabled = stateLocked;
            $('modal-dsp-gain').disabled = stateLocked;
            $('dsp-chain-list').querySelectorAll('input, select, button').forEach(control => {
                control.disabled = stateLocked || control.dataset.locked === 'true';
            });
            const available = dspDiscovery.status === 'ready' && dspDiscovery.processors.length > 0;
            $('new-processor-type').disabled = stateLocked || !available;
            $('dsp-add').disabled = stateLocked || !available || currentRouteDspState.chain.length >= dspDiscovery.maxChainLength;
            $('dsp-discovery-retry').disabled = modalBusy || dspDiscovery.status === 'loading';
            $('route-apply').disabled = stateLocked || dspDiscovery.status !== 'ready';
            $('route-apply').textContent = modalBusy ? 'WORKING…' : 'APPLY';
            $('route-cancel').disabled = modalBusy;
            $('route-delete').disabled = modalBusy;
            $('route-modal').setAttribute('aria-busy', modalBusy ? 'true' : 'false');
        }

        function readDspState(data) {
            if (!isObject(data) || typeof data.active !== 'boolean' || !Number.isFinite(data.gain) || !Array.isArray(data.chain)) {
                throw new Error('Invalid route DSP state returned by the backend.');
            }
            return cloneJson({ active: data.active, gain: data.gain, chain: data.chain });
        }

        function showDspState(state) {
            currentRouteDspState = state;
            $('modal-dsp-active').value = state.active ? 'true' : 'false';
            $('modal-dsp-gain').value = state.gain;
            renderDspDiscovery();
        }

        async function openRouteModal(route) {
            if (modalBusy) return;
            const session = ++modalSession;
            editingRouteId = route.id;
            currentRouteDspState = null;
            dspParameterBindings = [];
            setRouteError();
            $('dsp-route-warning').hidden = true;
            $('dsp-route-warning').textContent = '';
            $('dsp-state-status').textContent = 'Loading saved route DSP state…';
            $('modal-dsp-gain').value = '';
            const srcRef = route.source_node !== undefined ? route.source_node : route.source;
            const destRef = route.destination_node !== undefined ? route.destination_node : route.destination;
            const srcEpId = getEndpointId(srcRef);
            const destEpId = getEndpointId(destRef);

            $('route-info').textContent = `${srcEpId} (CH${route.source_channel + 1}) \u2192 ${destEpId} (CH${route.destination_channel + 1})`;
            $('modal-gain').value = route.gain;
            $('modal-enabled').value = route.enabled ? '1' : '0';
            $('overlay').style.display = 'block';
            $('route-modal').style.display = 'block';
            renderDspChain();
            updateModalControls();

            const discovery = loadDspAvailable();
            try {
                const dspData = await fetchAPI(`/api/routes/${encodeURIComponent(route.id)}/dsp`, { cache: 'no-store' });
                if (session !== modalSession) return;
                showDspState(readDspState(dspData));
                $('dsp-state-status').textContent = '';
                if (dspData.warning != null && dspData.warning !== '') {
                    $('dsp-route-warning').textContent = 'Backend warning: ' + (typeof dspData.warning === 'string' ? dspData.warning : displayJson(dspData.warning));
                    $('dsp-route-warning').hidden = false;
                }
            } catch (e) {
                if (session !== modalSession) return;
                $('dsp-state-status').textContent = '';
                setRouteError('Cannot load saved DSP state: ' + e.message + '\nAPPLY is disabled to avoid overwriting it. Close and reopen this route to retry.');
                updateModalControls();
            }
            await discovery;
        }

        function closeModal() {
            if (modalBusy) return;
            ++modalSession;
            editingRouteId = null;
            currentRouteDspState = null;
            dspParameterBindings = [];
            $('overlay').style.display = 'none';
            $('route-modal').style.display = 'none';
        }

        function dspButton(text, handler, className = 'dsp-small-btn') {
            const button = dspText('button', text, className);
            button.type = 'button';
            button.addEventListener('click', handler);
            return button;
        }

        function setDraftParam(processor, key, value) {
            Object.defineProperty(processor.params, key, { value, writable: true, configurable: true, enumerable: true });
        }

        function renderDspParameter(processor, descriptor, parameter, container, index) {
            const key = parameter.id;
            const defaultValue = parameter.default ?? descriptor.defaults[key];
            if (!hasOwn(processor.params, key) && defaultValue !== undefined) {
                setDraftParam(processor, key, cloneJson(defaultValue));
            }
            const savedValue = hasOwn(processor.params, key) ? processor.params[key] : undefined;
            const wrapper = document.createElement('div');
            const row = dspText('div', '', 'control-row');
            const label = dspText('label', (parameter.name ?? key) + (parameter.unit ? ` (${parameter.unit})` : ''));
            const control = document.createElement(parameter.type === 'boolean' || parameter.type === 'enum' ? 'select' : 'input');
            control.id = `dsp-param-${index}-${dspParameterBindings.length}`;
            label.htmlFor = control.id;
            let readValue;
            let validateType;
            if (parameter.type === 'boolean' || parameter.type === 'enum') {
                const choices = parameter.type === 'boolean' ? [{ label: 'True', value: true }, { label: 'False', value: false }] : parameter.choices;
                const match = choices.findIndex(choice => displayJson(choice.value) === displayJson(savedValue));
                if (match < 0) {
                    const invalid = dspText('option', 'Invalid saved value: ' + displayJson(savedValue));
                    invalid.value = '';
                    control.appendChild(invalid);
                }
                choices.forEach((choice, choiceIndex) => {
                    const option = dspText('option', choice.label ?? displayJson(choice.value));
                    option.value = String(choiceIndex);
                    control.appendChild(option);
                });
                control.value = match < 0 ? '' : String(match);
                control.required = true;
                readValue = () => control.value === '' ? savedValue : cloneJson(choices[Number(control.value)].value);
                validateType = () => control.value === '' ? 'Choose a valid value.' : '';
            } else if (parameter.type === 'number' || parameter.type === 'integer') {
                control.type = 'number';
                control.required = true;
                control.step = parameter.step ?? (parameter.type === 'integer' ? 1 : 'any');
                if (parameter.min != null) control.min = parameter.min;
                if (parameter.max != null) control.max = parameter.max;
                control.value = typeof savedValue === 'number' || typeof savedValue === 'string' ? savedValue : '';
                readValue = () => control.value.trim() === '' ? '' : Number(control.value);
                validateType = () => {
                    const value = readValue();
                    if (value === '' || !Number.isFinite(value)) return 'Enter a finite number.';
                    if (parameter.type === 'integer' && !Number.isInteger(value)) return 'Enter a whole number.';
                    return '';
                };
            } else {
                control.type = 'text';
                control.value = typeof savedValue === 'string' ? savedValue : displayJson(savedValue);
                readValue = () => control.value;
                validateType = () => typeof processor.params[key] === 'string' ? '' : 'Saved value is not a string; edit it to provide a string.';
            }
            const validate = () => {
                control.setCustomValidity(validateType());
                return control.checkValidity();
            };
            control.addEventListener('input', () => {
                setDraftParam(processor, key, readValue());
                validate();
            });
            control.addEventListener('change', () => {
                setDraftParam(processor, key, readValue());
                validate();
            });
            dspParameterBindings.push({ control, validate, commit: () => setDraftParam(processor, key, readValue()) });
            row.append(label, control);
            wrapper.appendChild(row);
            const hints = [];
            if (parameter.min != null) hints.push('min ' + parameter.min);
            if (parameter.max != null) hints.push('max ' + parameter.max);
            if (parameter.step != null) hints.push('step ' + parameter.step);
            hints.push('default ' + displayJson(defaultValue));
            const help = dspText('div', hints.join(' · '), 'dsp-help');
            help.id = control.id + '-help';
            control.setAttribute('aria-describedby', help.id);
            wrapper.appendChild(help);
            container.appendChild(wrapper);
        }

        function renderDspChain() {
            const container = $('dsp-chain-list');
            container.replaceChildren();
            dspParameterBindings = [];
            if (!currentRouteDspState) {
                container.appendChild(dspText('div', 'Saved DSP state has not been loaded.', 'dsp-help'));
                return;
            }
            if (currentRouteDspState.chain.length === 0) {
                container.appendChild(dspText('div', 'No processors in chain.', 'dsp-help'));
            }
            currentRouteDspState.chain.forEach((processor, index) => {
                const descriptor = isObject(processor) ? dspDiscovery.processors.find(item => item.type === processor.type) : undefined;
                const card = dspText('div', '', 'dsp-processor-card');
                const header = dspText('div', '', 'dsp-processor-header');
                const type = isObject(processor) ? processor.type : '(invalid processor)';
                header.appendChild(dspText('span', `#${index + 1}: ${descriptor?.name ?? type}`));
                const actions = dspText('div', '', 'dsp-actions');
                const up = dspButton('↑', () => moveProcessor(index, -1));
                up.title = 'Move processor up';
                up.setAttribute('aria-label', `Move processor ${index + 1} up`);
                up.dataset.locked = String(index === 0);
                const down = dspButton('↓', () => moveProcessor(index, 1));
                down.title = 'Move processor down';
                down.setAttribute('aria-label', `Move processor ${index + 1} down`);
                down.dataset.locked = String(index === currentRouteDspState.chain.length - 1);
                actions.append(up, down, dspButton('Remove', () => removeProcessor(index), 'remove-btn'));
                header.appendChild(actions);
                card.appendChild(header);
                const params = dspText('div', '', 'dsp-processor-params');
                if (!descriptor) {
                    card.classList.add('unavailable');
                    const reason = dspDiscovery.status === 'ready' ? 'Unavailable processor on this backend. Remove it before applying, or restore the plugin.' : 'Processor availability cannot be verified until discovery succeeds.';
                    card.appendChild(dspText('div', reason, 'dsp-help dsp-warning'));
                    if (isObject(processor)) params.appendChild(dspText('div', 'Saved parameters: ' + displayJson(processor.params), 'dsp-help'));
                } else if (!isObject(processor.params)) {
                    card.classList.add('unavailable');
                    card.appendChild(dspText('div', 'Invalid saved parameters. Remove this processor and add it again.', 'dsp-help dsp-warning'));
                    params.appendChild(dspText('div', displayJson(processor.params), 'dsp-help'));
                } else {
                    if (descriptor.description) card.appendChild(dspText('div', descriptor.description, 'dsp-help'));
                    descriptor.parameters.forEach(parameter => renderDspParameter(processor, descriptor, parameter, params, index));
                    const known = new Set(descriptor.parameters.map(parameter => parameter.id));
                    for (const [key, value] of Object.entries(processor.params)) {
                        if (known.has(key)) continue;
                        const extra = dspText('div', '', 'dsp-extra-param');
                        extra.appendChild(dspText('span', `Unknown parameter ${key}: ${displayJson(value)}`, 'dsp-help dsp-warning'));
                        extra.appendChild(dspButton('Remove parameter', () => {
                            if (modalBusy) return;
                            delete processor.params[key];
                            renderDspChain();
                            updateModalControls();
                        }, 'remove-btn'));
                        params.appendChild(extra);
                    }
                    if (!params.children.length) params.appendChild(dspText('div', 'No parameters.', 'dsp-help'));
                }
                card.appendChild(params);
                container.appendChild(card);
                if (index < currentRouteDspState.chain.length - 1) container.appendChild(dspText('div', '↓', 'chain-arrow'));
            });
            updateModalControls();
        }

        function addProcessorToChain() {
            if (modalBusy || !currentRouteDspState || dspDiscovery.status !== 'ready') return;
            if (currentRouteDspState.chain.length >= dspDiscovery.maxChainLength) {
                setRouteError('The backend chain limit is ' + dspDiscovery.maxChainLength + '. Remove a processor before adding another.');
                return;
            }
            const descriptor = dspDiscovery.processors.find(processor => processor.type === $('new-processor-type').value);
            if (!descriptor) return;
            const processor = { type: descriptor.type, params: cloneJson(descriptor.defaults) };
            for (const parameter of descriptor.parameters) {
                if (!hasOwn(processor.params, parameter.id)) {
                    const value = parameter.default ?? descriptor.defaults[parameter.id];
                    if (value !== undefined) setDraftParam(processor, parameter.id, cloneJson(value));
                }
            }
            currentRouteDspState.chain.push(processor);
            renderDspDiscovery();
        }

        function removeProcessor(index) {
            if (modalBusy || !currentRouteDspState) return;
            currentRouteDspState.chain.splice(index, 1);
            renderDspDiscovery();
        }

        function moveProcessor(index, direction) {
            if (modalBusy || !currentRouteDspState) return;
            const chain = currentRouteDspState.chain;
            const destination = index + direction;
            if (destination < 0 || destination >= chain.length) return;
            [chain[index], chain[destination]] = [chain[destination], chain[index]];
            renderDspChain();
            updateModalControls();
        }

        function validatedRouteDraft() {
            if (!currentRouteDspState) throw new Error('Saved DSP state has not loaded. Close and reopen this route to retry.');
            if (dspDiscovery.status !== 'ready') throw new Error('DSP discovery must succeed before applying. Use Refresh processors to retry.');
            if (currentRouteDspState.chain.length > dspDiscovery.maxChainLength) {
                throw new Error('Chain exceeds the backend limit of ' + dspDiscovery.maxChainLength + ' processors. Remove processors before applying.');
            }
            for (const id of ['modal-gain', 'modal-dsp-gain']) {
                const control = $(id);
                const value = control.value.trim() === '' ? NaN : Number(control.value);
                control.setCustomValidity(Number.isFinite(value) ? '' : 'Enter a finite gain value.');
                if (!control.reportValidity()) throw new Error('Correct the gain value before applying.');
            }
            for (const binding of dspParameterBindings) {
                if (!binding.validate()) {
                    binding.control.reportValidity();
                    throw new Error('Correct the highlighted processor parameter before applying.');
                }
            }
            for (const processor of currentRouteDspState.chain) {
                const descriptor = isObject(processor) ? dspDiscovery.processors.find(item => item.type === processor.type) : undefined;
                if (!descriptor) throw new Error('Remove unavailable processors before applying, or restore the missing plugins and refresh processors.');
                if (!isObject(processor.params)) throw new Error('Remove and re-add processors with invalid saved parameters.');
                const known = new Set(descriptor.parameters.map(parameter => parameter.id));
                if (Object.keys(processor.params).some(key => !known.has(key))) {
                    throw new Error('Remove the visible unknown parameters before applying. The backend rejects unsupported parameters.');
                }
            }
            dspParameterBindings.forEach(binding => binding.commit());
            return {
                gain: Number($('modal-gain').value),
                enabled: $('modal-enabled').value === '1',
                dsp: {
                    active: $('modal-dsp-active').value === 'true',
                    gain: Number($('modal-dsp-gain').value),
                    chain: cloneJson(currentRouteDspState.chain.map(processor => ({ type: processor.type, params: processor.params })))
                }
            };
        }

        async function saveRoute() {
            if (modalBusy || editingRouteId === null) return;
            setRouteError();
            let draft;
            try {
                draft = validatedRouteDraft();
            } catch (e) {
                setRouteError(e.message);
                return;
            }
            const id = editingRouteId;
            modalBusy = true;
            updateModalControls();
            let saved = false;
            let adopted = false;
            try {
                const result = await fetchAPI(`/api/routes/${encodeURIComponent(id)}/apply`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(draft)
                });
                if (result.status !== 'ok' || result.adopted !== true)
                    throw new Error('The backend did not confirm engine adoption.');
                adopted = true;
                showDspState(readDspState(result));
                $('dsp-route-warning').hidden = true;
                await loadGraph();
                saved = true;
            } catch (e) {
                setRouteError((adopted ? 'Changes were applied, but graph confirmation failed: ' : 'APPLY was not confirmed: ') + e.message + '\nThe inspector remains open. Refresh/review the route before retrying.');
            } finally {
                modalBusy = false;
                if (saved) closeModal();
                else {
                    renderDspChain();
                    updateModalControls();
                }
            }
        }

        async function deleteRoute() {
            if (modalBusy || editingRouteId === null) return;
            const id = editingRouteId;
            modalBusy = true;
            setRouteError();
            updateModalControls();
            let deleted = false;
            try {
                await fetchAPI(`/api/routes/${encodeURIComponent(id)}`, { method: 'DELETE' });
                deleted = true;
                await loadGraph();
            } catch (e) {
                setRouteError('Delete failed: ' + e.message);
            } finally {
                modalBusy = false;
                if (deleted) closeModal();
                else updateModalControls();
            }
        }

        async function updateMeters() {
            try {
                const data = await fetchAPI('/api/meters');
                cachedMeters.forEach(m => {
                    let meter = null;
                    if (m.epId.startsWith('pw-node/')) {
                        const nodeId = m.epId.slice('pw-node/'.length);
                        const node = pwGraph.nodes[nodeId];
                        const bankName = node && node.is_input ? 'playback' : 'capture';
                        const bank = data[bankName];
                        if (bank && bank[m.epId] && bank[m.epId][m.ch]) {
                            meter = bank[m.epId][m.ch];
                        }
                    } else if (m.epId.includes('/capture')) {
                        if (data.capture && data.capture[m.epId] && data.capture[m.epId][m.ch]) {
                            meter = data.capture[m.epId][m.ch];
                        }
                    } else if (m.epId.includes('/playback')) {
                        if (data.playback && data.playback[m.epId] && data.playback[m.epId][m.ch]) {
                            meter = data.playback[m.epId][m.ch];
                        }
                    }

                    if (meter) {
                        const width = Math.max(0, Math.min(100, (meter.rms_db + 60) * 100 / 60)) + '%';
                        m.fillEl.style.width = width;
                        if (m.peakEl) m.peakEl.classList.toggle('active', meter.clipped);
                    }
                });
            } catch (e) { console.error("Meter update error:", e); }
        }

        async function applyTone() {
            try {
                await fetchAPI(`/api/tone?enabled=${$('tone-enabled').value}&frequency=${$('tone-freq').value}&amplitude=${$('tone-amp').value}`, { method: 'POST' });
            } catch (e) { alert(e.message); }
        }

        async function applyDSP() {
            try {
                await fetchAPI(`/api/dsp?gain=${$('dsp-gain').value}`, { method: 'POST' });
            } catch (e) { alert(e.message); }
        }

        async function resetClips() { try { await fetchAPI('/api/reset_clips?all=1', { method: 'POST' }); } catch (e) {} }
        async function saveSettings() {
            try {
                const result = await fetchAPI('/api/settings/save', { method: 'POST' });
                if (!result.adopted || !result.persisted) throw new Error(result.message || 'Apply/save was not confirmed');
                alert('Applied configuration saved');
            } catch (e) { alert(e.message); }
        }
        async function refreshAll() { await Promise.all([loadGraph(), loadPipewireGraph(true), loadDevices(), loadDspAvailable()]); }

        const viewportObserver = new ResizeObserver(() => {
            drawCables();
        });

        window.onresize = drawCables;
        setInterval(updateMeters, 100);
        setInterval(() => loadPipewireGraph(), 1000);

        async function init() {
            const viewport = $('patchbay-viewport');
            if (viewport) viewportObserver.observe(viewport);

            Promise.allSettled([
                loadDevices(),
                loadGraph(),
                loadPipewireGraph(),
                loadDspAvailable()
            ]).then(() => {
                if ($('status')) $('status').textContent = 'Ready';
            });
        }
        init();
    </script>
    <script src="client/plugin_demo.js"></script>
</body>
